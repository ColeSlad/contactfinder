# Target companies for SWE internship outreach.
#
# `domain` is the EMAIL domain -- it anchors all address inference, so it must
# be where staff actually receive mail, which is not always the website. Every
# domain below was verified live: all resolve and all have MX records.
#
# `priority` is the expected yield of finding an early-career recruiter, NOT a
# ranking of the companies:
#   high   - confident structured campus / university recruiting program
#   normal - real recruiting team, campus program less certain
#   low    - seed / early stage; likely no recruiter at all, so aim at
#            engineering leadership instead
# These are estimates from company size and stage. Re-rank freely.
#
# careers_url is left blank deliberately rather than guessed; research fills it.

companies:


