# ContactFinder configuration.
# Precedence: values learned from real outcomes (stored in the DB) override
# anything here. Use this file to pin facts you already know.

run:
  # Minimum score for a contact to reach the outreach export.
  min_score: 0.45
  # Cap per company so one employer can't flood a batch.
  max_contacts_per_company: 5
  # Hard exclusions, applied regardless of score. Role relevance is a gate:
  # without this a software engineer with a fresh, well-sourced profile can
  # clear min_score on source quality and recency alone.
  exclude_flags: [off_target_role, no_email]

# Pin a company's email format when you know it for certain. Treated as a
# confirmed hit, which locks inference for everyone at that domain.
# Valid formats: first.last, firstlast, flast, first, f.last, first_last,
#                firstl, first.l, last.first, lastfirst, first-last, last, fl
known_formats: {}
  # example.com: first.last

# Apollo.io enrichment (optional; needs APOLLO_API_KEY).
# People Search is free but returns masked last names; People Enrichment costs
# credits. So search runs first and only roles scoring at least
# min_title_score get enriched. Use `enrich --dry-run` to look before paying.
apollo:
  min_title_score: 0.45
  per_page: 25
  # Apollo requires job titles to search for. Override if a company uses
  # unusual wording.
  titles:
    - university recruiter
    - campus recruiter
    - university recruiting
    - campus recruiting
    - early career recruiter
    - early talent
    - emerging talent
    - intern program manager
    - student programs
    - technical recruiter
    - recruiting coordinator
  # Inclusive filter. Omits c_suite/owner/founder/partner/vp: they do not
  # answer internship cold email, so enriching them wastes credits.
  seniorities: [entry, senior, manager, director, head]

# Override the global format prior or scoring weights only if you have reason
# to. Leaving these empty lets `cf learn` tune them from your actual results.
weights: {}
global_prior: {}
